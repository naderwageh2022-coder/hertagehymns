<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="profile.css">
<title>Create Account</title>

</head>
<body>

<div id="profile">
    <h2>الملف الشخصي</h2>
    <p><strong>اسم المستخدم:</strong> <span id="showUser">---</span></p>
    <p><strong>كلمة المرور:</strong> <span id="showPass">---</span></p>
</div>

<script>

function showPassword(id){
    const input = document.getElementById(id);

    if(input.type === "password"){
        input.type = "text";
    }else{
        input.type = "password";
    }
}

function createAccount(){

    const user = document.getElementById("theuserName").value;
    const pass = document.getElementById("password").value;
    const confirm = document.getElementById("confirmPassword").value;

    if(pass !== confirm){
        alert("Passwords do not match");
        return;
    }

    const userData = {
        user: user,
        pass: pass
    };

    localStorage.setItem("userData", JSON.stringify(userData));

    document.getElementById("showUser").textContent = user;
    document.getElementById("showPass").textContent = pass;

    alert("Account Created Successfully");
}

const savedData = JSON.parse(localStorage.getItem("userData"));

if(savedData){
    document.getElementById("showUser").textContent = savedData.user;
    document.getElementById("showPass").textContent = savedData.pass;
}
let user = JSON.parse(localStorage.getItem("loggedInUser"));

document.getElementById("name").innerText = user.user;
</script>

</body>
</html>
