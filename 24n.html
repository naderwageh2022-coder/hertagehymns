<h2>
أيها الفخاري الأعظم
<br><br>
(ق) ايها الفخاري الاعظم
انا كالخزف بين يديك
عد واصنعني وعاء اخر
مثلما يحسن في عينيك
<br><br>

(1) اخضع ذاتي دون عناد
لاصابعك تشكل في
ان اتوجع لن اتراجع
فانا اشتقت لعملك في
<br><br>

(2) اتي اليك بكل فسادي
ثقتي في نعمتك ويديك
لا لليأس ولا للماضي
قلبي اتجه الان اليك
</h2>
