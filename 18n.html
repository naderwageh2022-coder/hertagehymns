<h2>
مين أحن منك
<br><br>
(ق) مين أحن منك
ألتجئ إليه
وفي كل ضيقي وتعبي
أتكل عليه
<br><br>

(1) يا قاضي الأرامل
يا أبو الأيتام
حلال المشاكل
صانع السلام
<br><br>

(2) الأشبال احتاجت
والأسود بتجوع
أما المؤمنين
أشبعهم يسوع
<br><br>

(3) ان طلبت غيرك
انتظاري يطول
لكن إن دعيتك
بتجيني على طول
</h2>
