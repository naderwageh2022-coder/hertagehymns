<h2>
يا مريم البكر
<br><br>
يا مريم البكر فقتى
الشمس والقمرا
وكل نجم بأفلاك
السماء سرى
<br><br>
يا نجمة الصبح شعى
فى معابدنا
ونورى عقلنا
والسمع والبصر
<br><br>
يا أم يسوع يا أمى
ويا أملى
لا تهملينى متى
منى الخطا صدرا
<br><br>
أنت ملاذى وعونى
كلما ضعفت
نفسى وجبرا لقلبى
كلما انكسرا
</h2>
